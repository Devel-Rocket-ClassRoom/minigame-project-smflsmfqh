<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="'Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="inherit" viewBox="0 0 14 12" refX="13" refY="6" markerWidth="16" markerHeight="14" orient="auto">
      <path d="M0,0 L14,6 L0,12 z" fill="white" stroke="#4B5563" stroke-width="1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="620" fill="#FFFFFF"/>

  <!-- ItemData -->
  <rect x="40" y="30" width="300" height="110" rx="10" fill="#EAF2FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="190" y="58" text-anchor="middle" font-size="18" font-weight="700" fill="#1E3A8A">ItemData</text>
  <text x="60" y="86" font-size="13" fill="#374151">
    <tspan x="60" dy="0">아이템 이름 · 드롭 프리팹 · 카테고리</tspan>
    <tspan x="60" dy="22" font-weight="700" fill="#1D4ED8">ItemEffectSO[] 배열 보유</tspan>
  </text>

  <!-- Arrow ItemData -> ItemEffectSO -->
  <line x1="190" y1="140" x2="190" y2="188" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="170" font-size="12" fill="#4B5563">효과 목록을 배열로 보유</text>

  <!-- ItemEffectSO (abstract) -->
  <rect x="40" y="190" width="300" height="110" rx="10" fill="#F3F3F1" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="190" y="212" text-anchor="middle" font-size="11" fill="#6B7280">«abstract»</text>
  <text x="190" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">ItemEffectSO</text>
  <text x="60" y="262" font-size="13" fill="#374151">
    <tspan x="60" dy="0">Apply(PlayerController)</tspan>
    <tspan x="60" dy="22">EffectParticleType 태그 보유</tspan>
  </text>

  <!-- Concrete subclasses -->
  <!-- HealEffectSO -->
  <rect x="40" y="390" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="135" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">HealEffectSO</text>
  <text x="135" y="444" text-anchor="middle" font-size="12" fill="#4B5563">회복량</text>
  <text x="135" y="465" text-anchor="middle" font-size="11" fill="#9CA3AF">Apply()</text>

  <!-- InvincibleEffectSO -->
  <rect x="255" y="390" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="350" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">InvincibleEffectSO</text>
  <text x="350" y="444" text-anchor="middle" font-size="12" fill="#4B5563">무적 시간</text>
  <text x="350" y="465" text-anchor="middle" font-size="11" fill="#9CA3AF">Apply()</text>

  <!-- SpeedBoostEffectSO -->
  <rect x="470" y="390" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="565" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">SpeedBoostEffectSO</text>
  <text x="565" y="444" text-anchor="middle" font-size="12" fill="#4B5563">이동속도 배율</text>
  <text x="565" y="465" text-anchor="middle" font-size="11" fill="#9CA3AF">Apply()</text>

  <!-- Inheritance arrows (child -> parent, hollow triangle at parent) -->
  <line x1="135" y1="390" x2="175" y2="302" stroke="#4B5563" stroke-width="1.5" marker-end="url(#inherit)"/>
  <line x1="350" y1="390" x2="220" y2="302" stroke="#4B5563" stroke-width="1.5" marker-end="url(#inherit)"/>
  <line x1="565" y1="390" x2="270" y2="302" stroke="#4B5563" stroke-width="1.5" marker-end="url(#inherit)"/>

  <!-- PlayerController -->
  <rect x="790" y="270" width="330" height="170" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="955" y="298" text-anchor="middle" font-size="18" font-weight="700" fill="#92400E">PlayerController</text>
  <text x="810" y="326" font-size="13" fill="#374151">
    <tspan x="810" dy="0">ParticleSystem 인스턴스 보유</tspan>
    <tspan x="810" dy="22">(Heal / Invincible / SpeedBoost 등)</tspan>
    <tspan x="810" dy="30" font-weight="700" fill="#92400E">PlayEffect(tag) 호출 시</tspan>
    <tspan x="810" dy="20" font-weight="700" fill="#92400E">태그로 실제 파티클 선택·재생</tspan>
  </text>

  <!-- Arrow ItemEffectSO -> PlayerController (tag only, no particle asset) -->
  <path d="M340,235 C 560,235 560,300 788,335" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="222" font-size="12" fill="#4B5563">EffectParticleType 태그만 전달</text>
  <text x="470" y="240" font-size="11" fill="#9CA3AF">(파티클 애셋 자체는 미포함)</text>

  <!-- Legend -->
  <g font-size="11" fill="#6B7280">
    <line x1="40" y1="560" x2="80" y2="560" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="88" y="564">추상 클래스</text>
    <line x1="180" y1="560" x2="222" y2="560" stroke="#4B5563" stroke-width="1.5" marker-end="url(#inherit)"/>
    <text x="230" y="564">상속</text>
    <line x1="280" y1="560" x2="322" y2="560" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="330" y="564">데이터·호출 흐름</text>
  </g>
</svg>
